name: Daily Power Consumption Forecast Pipeline

on:
  schedule:
    # 毎日 UTC 15:00（日本時間 AM 0:00）に自動実行
    - cron: '0 15 * * *'
  workflow_dispatch: # 手動でいつでも実行できるボタンをGitHub上に作る（デバッグに必須！）

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-state: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    # 🌟 Google Cloud認証のための設定ステップ
    - name: Authenticate to Google Cloud
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Run Pipeline Script
      env:
        # GitHubのSettings > Secretsで登録したGeminiのAPIキーを環境変数に渡す
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python src/daily_pipeline.py

